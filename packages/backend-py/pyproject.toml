[project]
name = "cogria-backend"
version = "0.0.0"
description = "CogriaAgent Python backend SDK: framework-agnostic AgentAction core + thin FastAPI mount layer."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyjwt>=2.9",
    "cogria-contract",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
redis = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogria_backend"]

[tool.uv.sources]
cogria-contract = { workspace = true }
