[project]
name = "cogria-contract"
version = "0.0.0"
description = "CogriaAgent HTTP contract: shared pydantic types, JSON Schemas, and a conformance test suite."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogria_contract"]
