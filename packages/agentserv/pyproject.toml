[project]
name = "cogria-agentserv"
version = "0.0.0"
description = "CogriaAgent orchestration kernel: LangGraph + FastAPI + custom SSE + dynamic tool system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "cogria-contract",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
sentry = ["sentry-sdk[fastapi]>=2.18,<3"]
# Durable persistence (SqlConversationBackend / SqlAttachmentRepository).
sql = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
# Attachment uploads: multipart parsing, magic-byte sniffing, doc extraction.
attachments = [
    "python-multipart>=0.0.9",
    "filetype>=1.2",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,xlsx,pptx]>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cogria_agent"]

[tool.uv.sources]
cogria-contract = { workspace = true }
