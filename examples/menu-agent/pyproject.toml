[project]
name = "menu-agent-example"
version = "0.0.0"
description = "Restaurant-menu example: a write-heavy domain declared with the backend-py SDK, proving the kernel is unchanged across domains."
requires-python = ">=3.11"
dependencies = [
    "cogria-agentserv",
    "cogria-backend",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["menu_agent"]

[tool.uv.sources]
cogria-agentserv = { workspace = true }
cogria-backend = { workspace = true }
