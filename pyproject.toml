[tool.uv.workspace]
members = [
    "packages/agentserv",
    "packages/contract",
    "packages/backend-py",
    "examples/todo-agent",
    "examples/menu-agent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib mode lets identically-named tests/ dirs across packages coexist
# without __init__ package-name collisions.
addopts = "--import-mode=importlib"
